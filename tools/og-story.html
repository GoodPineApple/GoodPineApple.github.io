<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    font-family: Pretendard, -apple-system, sans-serif;
    background: #fdfdfb; color: #17181c;
    display: flex; flex-direction: column; justify-content: center;
    padding: 78px 84px;
    position: relative;
  }
  .accent-bar { position: absolute; top: 0; left: 0; width: 100%; height: 10px; background: #1d4ed8; }
  .eyebrow {
    font-size: 22px; font-weight: 700; letter-spacing: 0.14em;
    color: #1d4ed8; text-transform: uppercase; margin-bottom: 26px;
  }
  h1 {
    font-size: 74px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.18;
  }
  .desc {
    margin-top: 30px; font-size: 27px; line-height: 1.6; color: #55585f; font-weight: 500;
  }
  .rule { margin-top: 46px; width: 100%; height: 1px; background: #e2e0d9; }
  .foot { margin-top: 28px; display: flex; align-items: center; gap: 18px; }
  .name { font-size: 26px; font-weight: 800; letter-spacing: -0.01em; }
  .dot { width: 5px; height: 5px; border-radius: 50%; background: #b8b5ac; }
  .role { font-size: 24px; font-weight: 600; color: #6f7480; }
  .services {
    position: absolute; right: 84px; bottom: 78px;
    text-align: right; font-size: 21px; font-weight: 600; color: #8d9099; line-height: 1.75;
  }
  .mark {
    position: absolute; top: 74px; right: 84px;
    width: 92px; height: 92px; border-radius: 22px; background: #17181c;
    display: flex; align-items: center; justify-content: center;
    color: #fdfdfb; font-size: 43px; font-weight: 800; letter-spacing: -0.04em;
  }
</style>
</head>
<body>
  <div class="accent-bar"></div>
  <div class="mark">TK</div>
  <p class="eyebrow">AI Native Development</p>
  <h1>AI를 팀원 삼아,<br>혼자서도 팀의 속도로.</h1>
  <p class="desc">밀도 높은 병렬 업무, 제품에 심은 AI, 아이디어의 즉시 서비스화.<br>10년 차 개발자가 AI와 일하는 방식.</p>
  <div class="rule"></div>
  <div class="foot">
    <span class="name">김태민</span>
    <span class="dot"></span>
    <span class="role">구스피크 · 에고라이팅 CTO</span>
  </div>
  <p class="services">Claude · Codex</p>
</body>
</html>
